
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | RamBook Exchange</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<header>
    <div class="logo">Ram<span>Book</span> Exchange</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="marketplace.html">Browse Books</a>
        <a href="add_book.html">Sell or Trade</a>
        <a href="return_books.html">Return Books</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<section class="auth-section">

    <div class="auth-card">

        <h1>Join the Ram Community!</h1>
        <p class="auth-subtitle">
            Create your RamBook Exchange account.
        </p>

        <form id="registerForm" method="post">

            <label for="firstName">First Name</label>
            <input type="text" id="firstName"
                   name="firstName" required>

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName"
                   name="lastName" required>

            <label for="studentID">Student ID</label>
            <input type="text" id="studentID"
                   name="studentID" required>

            <label for="email">WSSU Student Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your WSSU email" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   name="password" minlength="8"
                   autocomplete="new-password"
                   placeholder="At least 8 characters" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   autocomplete="new-password" required>

            <div class="show-password">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Show Passwords</label>
            </div>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <p id="registerMessage" class="auth-message"
           role="status" hidden></p>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>

    </div>

</section>

<footer>
    <p>&copy; 2026 RamBook Exchange</p>
    <p>For Rams. By Rams.</p>
    <p>Unofficial WSSU student project.</p>
</footer>

<script>
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    document.getElementById("showPassword")
        .addEventListener("change", function() {
            const type = this.checked ? "text" : "password";

            password.type = type;
            confirmPassword.type = type;
        });

    document.getElementById("registerForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            const message = document.getElementById("registerMessage");

            message.hidden = false;

            if (password.value !== confirmPassword.value) {
                message.style.color = "#C8102E";
                message.textContent = "Passwords do not match!";
                return;
            }

            message.style.color = "green";
            message.textContent =
                "Registration form completed! Demo only. No account has been saved.";

            this.reset();

            password.type = "password";
            confirmPassword.type = "password";
        });
</script>

</body>
</html>
